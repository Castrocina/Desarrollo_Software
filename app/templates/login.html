{% extends "base.html" %}
{% block title %}Iniciar sesión - Sistema de Quejas{% endblock %}
{% block header %}Bienvenido al Sistema de Gestión de Quejas{% endblock %}
{% block content %}
<div class="card">
  <h2>Iniciar sesión</h2>
  <form method="post" action="/login" class="form-vertical">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required />
    <button type="submit" class="button-primary">Iniciar sesión</button>
  </form>
  <div class="form-links">
    <a href="/registro">Crear Usuario</a>
    <a href="#" onclick="alert('Contacte al administrador para recuperar su contraseña.'); return false;">Olvidé mi contraseña</a>
  </div>
</div>
{% endblock %}
