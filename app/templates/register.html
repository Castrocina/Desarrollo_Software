{% extends "base.html" %}
{% block title %}Registro de usuario - Sistema de Quejas{% endblock %}
{% block header %}Crear Usuario{% endblock %}
{% block content %}
<div class="card">
  <h2>Regístrate</h2>
  <form method="post" action="/registro" class="form-vertical">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required />
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required />
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required />
    <button type="submit" class="button-primary">Crear cuenta</button>
  </form>
  <div class="form-links">
    <a href="/">¿Ya tienes cuenta? Inicia sesión</a>
  </div>
</div>
{% endblock %}
